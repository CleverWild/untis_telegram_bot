[package]
name = "untis_telegram_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.38"
eyre = "0.6.12"
rand = "0.9.1"
# axum = "0.7.7"
# reqwest = { version = "0.12.9", features = ["json"] }
serde_json = "1.0.133"
# shuttle-axum = "0.49.0"
shuttle-runtime = { version = "0.55.0", default-features = false }
teloxide = { version = "0.15.0", features = ["macros"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
untis = {path = "untis"}

[workspace]
members = ["untis"]
