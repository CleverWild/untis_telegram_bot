name: Auto PR from dev to prod

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch prod branch
        run: git fetch origin prod

      - name: Get version from dev branch
        id: dev_version
        run: |
          DEV_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$DEV_VERSION" >> $GITHUB_OUTPUT

      - name: Get version from prod branch
        id: prod_version
        run: |
          PROD_VERSION=$(git show origin/prod:Cargo.toml | grep '^version = ' | sed 's/version = "\(.*\)"/\1/')
          echo "version=$PROD_VERSION" >> $GITHUB_OUTPUT
          
      - name: Create PR if versions differ
        id: create_pr
        run: |
          if [ "${{ steps.dev_version.outputs.version }}" != "${{ steps.prod_version.outputs.version }}" ]; then
            git checkout -b auto-pr-from-dev-to-prod
            git commit --allow-empty -m "Auto PR from dev to prod"
            git push origin auto-pr-from-dev-to-prod
            gh pr create \
              --base prod \
              --head auto-pr-from-dev-to-prod \
              --title "Auto PR from dev to prod" \
              --body "This PR is automatically created to update the prod branch with changes from dev, because new version $DEV_VERSION is available."
          else
            echo "No changes to be made. Versions are the same."
          fi